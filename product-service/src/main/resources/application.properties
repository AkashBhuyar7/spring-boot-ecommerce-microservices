spring.application.name=product-service
# Random port, so several instances can run side by side behind the gateway's load balancer
server.port=0

# MongoDB
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/product-service}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

# Error responses
spring.mvc.problemdetails.enabled=true

# Tracing
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
