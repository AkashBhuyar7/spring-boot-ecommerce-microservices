name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Integration tests start MongoDB and SQL Server with Testcontainers (Docker is available on GitHub runners)
      - name: Build and test
        run: ./mvnw -B verify
