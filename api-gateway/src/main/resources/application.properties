spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}

# Routes
spring.cloud.gateway.server.webmvc.routes[0].id=product-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/product

spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/order

spring.cloud.gateway.server.webmvc.routes[2].id=discovery-server
spring.cloud.gateway.server.webmvc.routes[2].uri=${EUREKA_DASHBOARD_URL:http://localhost:8761}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/eureka/web
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=SetPath=/

spring.cloud.gateway.server.webmvc.routes[3].id=discovery-server-static
spring.cloud.gateway.server.webmvc.routes[3].uri=${EUREKA_DASHBOARD_URL:http://localhost:8761}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/eureka/**

# Security: signing keys are fetched from the JWK set URI, and the token's "iss" claim must match the issuer URI
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/spring-boot-microservices-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8181/realms/spring-boot-microservices-realm/protocol/openid-connect/certs}

# Tracing
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
